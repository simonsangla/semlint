[project]
name = "semlint"
version = "0.1.0"
description = "Local-only semantic-layer / metric-definition audit with a deterministic Semantic Trust Score"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
app = ["streamlit>=1.30"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
semlint = "semlint.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["semlint*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
