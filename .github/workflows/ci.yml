name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: setup python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: install
        run: pip install -e ".[dev]"
      - name: lint (ruff)
        run: ruff check .
      - name: compile
        run: python -m compileall semlint app.py
      - name: test (pytest)
        run: pytest -q
      - name: source guards
        run: |
          if LC_ALL=C grep -rPl '[^\x00-\x7F]' --include='*.py' --include='*.yml' --include='*.toml' semlint app.py reality_demo.yml metrics_demo.yml pyproject.toml .streamlit; then
            echo "non-ASCII found in source"; exit 1
          fi
          if grep -rInE "snowflake|snowpark|psycopg|sqlalchemy|connector" --include='*.py' semlint app.py tests; then
            echo "live-warehouse import found"; exit 1
          fi
          if grep -rIn -i "metricpilot" semlint app.py README.md reality_demo.yml metrics_demo.yml pyproject.toml; then
            echo "metricpilot reference found"; exit 1
          fi
          echo "source guards passed"
